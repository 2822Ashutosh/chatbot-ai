<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <!-- Glow effect -->
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#6c5ce7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Skin gradient -->
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c8a0"/>
      <stop offset="100%" stop-color="#dba87a"/>
    </linearGradient>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="40%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <!-- Hair highlight -->
    <linearGradient id="hairHighlight" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <!-- Hoodie gradient -->
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <!-- Hoodie accent -->
    <linearGradient id="hoodieAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <!-- Eye glow -->
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Outer glow -->
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Clip for circular avatar -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="190"/>
    </clipPath>
  </defs>

  <!-- Circular background -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="url(#glowGrad)"/>

  <!-- Content clipped to circle -->
  <g clip-path="url(#circleClip)">

    <!-- Ambient particles / stars -->
    <circle cx="80" cy="80" r="1.5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="320" cy="100" r="1" fill="#6c5ce7" opacity="0.5"/>
    <circle cx="60" cy="280" r="1.2" fill="#00d4ff" opacity="0.4"/>
    <circle cx="340" cy="260" r="1.8" fill="#a78bfa" opacity="0.3"/>
    <circle cx="150" cy="50" r="1" fill="#fff" opacity="0.3"/>
    <circle cx="300" cy="60" r="0.8" fill="#fff" opacity="0.2"/>
    <circle cx="50" cy="180" r="1.3" fill="#6c5ce7" opacity="0.4"/>
    <circle cx="350" cy="180" r="1" fill="#00d4ff" opacity="0.35"/>

    <!-- ══ NECK ══ -->
    <path d="M170 290 L170 330 Q170 350 185 355 L215 355 Q230 350 230 330 L230 290"
          fill="url(#skinGrad)" filter="url(#shadow)"/>

    <!-- ══ HOODIE / BODY ══ -->
    <g filter="url(#shadow)">
      <!-- Main hoodie shape -->
      <path d="M80 400 Q80 330 120 310 L150 300 Q170 295 200 295 Q230 295 250 300 L280 310 Q320 330 320 400 Z"
            fill="url(#hoodieGrad)"/>
      <!-- Hoodie collar -->
      <path d="M155 298 Q175 310 200 312 Q225 310 245 298 Q230 295 200 293 Q170 295 155 298"
            fill="#252535"/>
      <!-- Neon accent line - left -->
      <path d="M120 310 Q115 340 105 380" stroke="url(#hoodieAccent)" stroke-width="2.5" fill="none" opacity="0.7" filter="url(#outerGlow)"/>
      <!-- Neon accent line - right -->
      <path d="M280 310 Q285 340 295 380" stroke="url(#hoodieAccent)" stroke-width="2.5" fill="none" opacity="0.7" filter="url(#outerGlow)"/>
      <!-- Hoodie center zipper line -->
      <line x1="200" y1="312" x2="200" y2="400" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
      <!-- Small hoodie drawstring dots -->
      <circle cx="188" cy="305" r="2" fill="#00d4ff" opacity="0.6"/>
      <circle cx="212" cy="305" r="2" fill="#00d4ff" opacity="0.6"/>
      <!-- Drawstrings -->
      <path d="M188 305 L185 325" stroke="#aaa" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M212 305 L215 325" stroke="#aaa" stroke-width="1" fill="none" opacity="0.5"/>
      <!-- Hoodie tech pattern -->
      <path d="M140 350 L155 340 L165 355 L175 335" stroke="#00d4ff" stroke-width="0.8" fill="none" opacity="0.2"/>
      <path d="M230 345 L245 350 L250 335 L265 355" stroke="#6c5ce7" stroke-width="0.8" fill="none" opacity="0.2"/>
    </g>

    <!-- ══ HEAD / FACE ══ -->
    <g filter="url(#shadow)">
      <!-- Face shape -->
      <ellipse cx="200" cy="225" rx="68" ry="78" fill="url(#skinGrad)"/>
      <!-- Chin definition -->
      <ellipse cx="200" cy="280" rx="30" ry="12" fill="#d4a574" opacity="0.3"/>
    </g>

    <!-- ══ EARS ══ -->
    <ellipse cx="132" cy="225" rx="12" ry="18" fill="#dba87a"/>
    <ellipse cx="132" cy="225" rx="7" ry="12" fill="#c99565" opacity="0.5"/>
    <ellipse cx="268" cy="225" rx="12" ry="18" fill="#dba87a"/>
    <ellipse cx="268" cy="225" rx="7" ry="12" fill="#c99565" opacity="0.5"/>

    <!-- ══ EYEBROWS ══ -->
    <path d="M152 198 Q167 190 183 194" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M217 194 Q233 190 248 198" stroke="#1a1030" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- ══ EYES ══ -->
    <!-- Left eye -->
    <g>
      <!-- Eye white -->
      <ellipse cx="170" cy="215" rx="18" ry="14" fill="#fff"/>
      <!-- Iris -->
      <circle cx="172" cy="215" r="10" fill="#1a5276"/>
      <circle cx="172" cy="215" r="10" fill="url(#hoodieAccent)" opacity="0.3"/>
      <!-- Pupil -->
      <circle cx="172" cy="215" r="5" fill="#0a0a15"/>
      <!-- Eye reflection -->
      <circle cx="176" cy="211" r="3" fill="#fff" opacity="0.8"/>
      <circle cx="169" cy="218" r="1.5" fill="#fff" opacity="0.4"/>
      <!-- Cyan glow ring -->
      <circle cx="172" cy="215" r="8" stroke="#00d4ff" stroke-width="0.8" fill="none" opacity="0.4" filter="url(#eyeGlow)"/>
      <!-- Upper eyelid line -->
      <path d="M153 210 Q162 200 170 200 Q180 200 188 210" stroke="#1a1030" stroke-width="2" fill="none"/>
      <!-- Lower lash line -->
      <path d="M155 218 Q165 225 170 225 Q180 225 186 218" stroke="#1a1030" stroke-width="1" fill="none" opacity="0.4"/>
    </g>
    <!-- Right eye -->
    <g>
      <ellipse cx="230" cy="215" rx="18" ry="14" fill="#fff"/>
      <circle cx="228" cy="215" r="10" fill="#1a5276"/>
      <circle cx="228" cy="215" r="10" fill="url(#hoodieAccent)" opacity="0.3"/>
      <circle cx="228" cy="215" r="5" fill="#0a0a15"/>
      <circle cx="232" cy="211" r="3" fill="#fff" opacity="0.8"/>
      <circle cx="225" cy="218" r="1.5" fill="#fff" opacity="0.4"/>
      <circle cx="228" cy="215" r="8" stroke="#00d4ff" stroke-width="0.8" fill="none" opacity="0.4" filter="url(#eyeGlow)"/>
      <path d="M212 210 Q220 200 228 200 Q238 200 247 210" stroke="#1a1030" stroke-width="2" fill="none"/>
      <path d="M214 218 Q224 225 230 225 Q238 225 245 218" stroke="#1a1030" stroke-width="1" fill="none" opacity="0.4"/>
    </g>

    <!-- ══ NOSE ══ -->
    <path d="M196 230 Q200 240 204 230" stroke="#c09060" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="194" cy="232" r="2" fill="#c09060" opacity="0.15"/>
    <circle cx="206" cy="232" r="2" fill="#c09060" opacity="0.15"/>

    <!-- ══ MOUTH — slight smirk ══ -->
    <path d="M178 255 Q190 265 200 264 Q215 263 225 253" stroke="#c07050" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Upper lip highlight -->
    <path d="M188 256 Q195 252 200 253 Q205 252 212 256" fill="#d08060" opacity="0.3"/>

    <!-- ══ HAIR ══ -->
    <g>
      <!-- Main hair mass (back) -->
      <path d="M125 200 Q120 160 130 130 Q140 100 165 85 Q185 72 200 70 Q215 72 235 85 Q260 100 270 130 Q280 160 275 200 Q270 175 260 160 Q245 140 200 135 Q155 140 140 160 Q130 175 125 200"
            fill="url(#hairGrad)"/>
      <!-- Hair volume top -->
      <path d="M130 180 Q125 140 140 110 Q155 82 200 75 Q245 82 260 110 Q275 140 270 180 Q260 140 240 120 Q220 105 200 100 Q180 105 160 120 Q140 140 130 180"
            fill="url(#hairGrad)"/>

      <!-- Messy front bangs -->
      <path d="M140 170 Q145 130 160 115 Q170 105 190 98 L180 140 Q160 145 150 160 Z"
            fill="#1a1030"/>
      <path d="M180 100 Q195 90 210 95 Q200 92 195 110 L185 135 Z"
            fill="#0d0818"/>
      <path d="M200 95 Q220 88 240 100 Q250 108 255 125 L240 115 Q225 105 210 110 Z"
            fill="#1a1030"/>
      <!-- Side swept piece -->
      <path d="M250 130 Q260 120 268 140 Q272 155 270 175 L260 155 Q258 140 250 130"
            fill="#0d0818"/>
      <!-- Left side hair -->
      <path d="M130 175 Q125 150 132 135 L140 155 Q138 165 135 175 Z"
            fill="#0d0818"/>

      <!-- Hair highlights (tech glow) -->
      <path d="M160 110 Q175 95 195 92" stroke="#6c5ce7" stroke-width="1.5" fill="none" opacity="0.35"/>
      <path d="M210 93 Q235 100 248 115" stroke="#00d4ff" stroke-width="1.2" fill="none" opacity="0.3"/>
      <path d="M145 145 Q155 125 170 112" stroke="#a78bfa" stroke-width="1" fill="none" opacity="0.25"/>

      <!-- A few flyaway strands -->
      <path d="M175 95 Q168 80 172 70" stroke="#1a1030" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M215 90 Q220 75 215 65" stroke="#0d0818" stroke-width="1.8" fill="none" opacity="0.5"/>
      <path d="M240 105 Q248 90 255 82" stroke="#1a1030" stroke-width="1.5" fill="none" opacity="0.4"/>
    </g>

    <!-- ══ FACE SHADOW / BLUSH ══ -->
    <ellipse cx="158" cy="238" rx="12" ry="6" fill="#e88080" opacity="0.15"/>
    <ellipse cx="242" cy="238" rx="12" ry="6" fill="#e88080" opacity="0.15"/>

    <!-- ══ NECK SHADOW ══ -->
    <ellipse cx="200" cy="295" rx="45" ry="8" fill="#000" opacity="0.08"/>

  </g>

  <!-- Border ring (outer glow) -->
  <circle cx="200" cy="200" r="195" stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.2" filter="url(#outerGlow)"/>
  <circle cx="200" cy="200" r="198" stroke="#6c5ce7" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>
